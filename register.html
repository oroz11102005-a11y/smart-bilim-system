<!DOCTYPE html>
<html lang="ky"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Катталуу — Smart Bilim</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="header">
  <a class="logo" href="index.html">Smart <span>Bilim</span></a>
  <nav class="nav" id="mainNav">
    <a href="index.html">Башкы бет</a>
    <a href="login.html">Кирүү</a>
    <a href="register.html">Катталуу</a>
  </nav>
</header>

<main class="container">
<div class="card" style="max-width:560px;margin:auto">
<h2>Жаңы аккаунт ачуу</h2>
<label>Аты-жөнү</label><input id="fullname" placeholder="Мисалы: Асанов Нурбек">
<label>Email</label><input id="email" type="email" placeholder="email@example.com">
<label>Пароль</label><input id="password" type="password" placeholder="Кеминде 6 белги">
<label>Роль</label>
<select id="role">
<option value="student">Окуучу</option>
<option value="teacher">Мугалим</option>
<option value="admin">Админ</option>
</select>
<label>Класс</label>
<select id="grade">
<option value="">Мугалим/Админ үчүн бош калса болот</option>
<option value="5">5-класс</option><option value="6">6-класс</option><option value="7">7-класс</option><option value="8">8-класс</option><option value="9">9-класс</option>
</select>
<button class="btn green" onclick="register()">Катталуу</button>
<div id="msg" class="notice hidden"></div>
</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
</body></html>
